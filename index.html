<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ✅ Content Security Policy: منع XSS و MITM attacks -->
    <!-- ملاحظة: frame-ancestors يتم تطبيقه عبر HTTP headers فقط -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval';
      connect-src 'self' https://api.quran.com https://alfurqan.online https://api.quranpedia.net https://cdn.quranpedia.net https://quranenc.com https://cdn.islamic.network https://api.aladhan.com https://api.quranhub.com https://api.alquran.cloud;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com;
      img-src 'self' data: https:;
      font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net;
      media-src 'self' https://alfurqan.online https://cdn.islamic.network https://quranenc.com https://backup.qurango.net https://*.mp3quran.net;
      object-src 'none';
      base-uri 'self';
      form-action 'self'
    " />
    <!-- ✅ Referrer Policy: تحديد معلومات referrer المرسلة -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- ✅ أمان المتصفح الإضافي -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>azkar</title>
  </head>
